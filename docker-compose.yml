services:
  postgres:
    image: postgres:17
    container_name: bondlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bondlab}
      POSTGRES_USER: ${POSTGRES_USER:-bondlab_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bondlab_password}
    ports:
      - "5433:5432"
    volumes:
      - bondlab_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bondlab_user -d bondlab"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bondlab_postgres_data: