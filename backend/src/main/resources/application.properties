spring.application.name=fixed-income-product-manager

# Database configuration
# Override using DB_URL, DB_USERNAME and DB_PASSWORD environment variables.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/bondlab}
spring.datasource.username=${DB_USERNAME:bondlab_user}
spring.datasource.password=${DB_PASSWORD:bondlab_password}

# Hibernate
spring.jpa.hibernate.ddl-auto=update

# Swagger UI: /swagger-ui.html
# OpenAPI JSON: /v3/api-docs